name: contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  json-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate JSON documents
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool schema/decision-request.schema.json >/dev/null
          python -m json.tool schema/decision-record.schema.json >/dev/null
          python -m json.tool schema/specification.schema.json >/dev/null
          python -m json.tool schema/formal-check-result.schema.json >/dev/null
          python -m json.tool examples/decision-request.json >/dev/null
          python -m json.tool examples/decision-record.json >/dev/null
          python -m json.tool fixtures/broken/invalid-request.json >/dev/null
          python -m json.tool fixtures/broken/invalid-record.json >/dev/null
          python -m json.tool specifications/bootstrap-queue.json >/dev/null
          python -m json.tool specifications/bootstrap-queue.check.json >/dev/null
          python -m json.tool specifications/offline-contracts.json >/dev/null
          python -m json.tool specifications/offline-contracts.check.json >/dev/null
          python -m json.tool specifications/awq-enforcement.json >/dev/null
          python -m json.tool specifications/awq-enforcement.check.json >/dev/null
          python -m json.tool specifications/promotion-gate.json >/dev/null
          python -m json.tool specifications/promotion-gate.check.json >/dev/null
          python -m json.tool specifications/integration-binding.json >/dev/null
          python -m json.tool specifications/integration-binding.check.json >/dev/null
          python -m json.tool specifications/coordinator-evidence-binding.json >/dev/null
          python -m json.tool specifications/coordinator-evidence-binding.check.json >/dev/null
          python -m json.tool specifications/guidance-evaluation-plan.json >/dev/null
          python -m json.tool specifications/guidance-evaluation-plan.check.json >/dev/null
          python -m json.tool specifications/clarification-regret-gate.json >/dev/null
          python -m json.tool specifications/clarification-regret-gate.check.json >/dev/null
          python -m json.tool specifications/calibration-dimensions.json >/dev/null
          python -m json.tool specifications/calibration-dimensions.check.json >/dev/null
          python -m json.tool specifications/mixed-initiative-feedback.json >/dev/null
          python -m json.tool specifications/mixed-initiative-feedback.check.json >/dev/null
          python -m json.tool specifications/bounded-authority.json >/dev/null
          python -m json.tool specifications/bounded-authority.check.json >/dev/null
          python -m json.tool specifications/public-project-comparison.json >/dev/null
          python -m json.tool specifications/public-project-comparison.check.json >/dev/null
          python -m json.tool specifications/langgraph-pause-resume-mapping.json >/dev/null
          python -m json.tool specifications/langgraph-pause-resume-mapping.check.json >/dev/null
          python -m json.tool specifications/autogen-successor-comparison.json >/dev/null
          python -m json.tool specifications/autogen-successor-comparison.check.json >/dev/null
          python -m json.tool specifications/openhands-decision-gates.json >/dev/null
          python -m json.tool specifications/openhands-decision-gates.check.json >/dev/null
          python -m json.tool specifications/benchmark-governance-boundary.json >/dev/null
          python -m json.tool specifications/benchmark-governance-boundary.check.json >/dev/null
          python -m json.tool specifications/hitl-transfer-terminology.json >/dev/null
          python -m json.tool specifications/hitl-transfer-terminology.check.json >/dev/null
          python -m json.tool specifications/decision-evidence-separation.json >/dev/null
          python -m json.tool specifications/decision-evidence-separation.check.json >/dev/null
          python -m json.tool fixtures/broken/invalid-spec.json >/dev/null
          python -m json.tool fixtures/broken/invalid-formal-check.json >/dev/null
          python tools/check_spec.py specifications/bootstrap-queue.json --result specifications/bootstrap-queue.check.json
          python tools/check_spec.py specifications/offline-contracts.json --result specifications/offline-contracts.check.json
          python tools/check_spec.py specifications/awq-enforcement.json --result specifications/awq-enforcement.check.json
          python tools/check_spec.py specifications/promotion-gate.json --result specifications/promotion-gate.check.json
          python tools/check_spec.py specifications/integration-binding.json --result specifications/integration-binding.check.json
          python tools/check_spec.py specifications/coordinator-evidence-binding.json --result specifications/coordinator-evidence-binding.check.json
          python tools/check_spec.py specifications/guidance-evaluation-plan.json --result specifications/guidance-evaluation-plan.check.json
          python tools/check_spec.py specifications/clarification-regret-gate.json --result specifications/clarification-regret-gate.check.json
          python tools/check_spec.py specifications/calibration-dimensions.json --result specifications/calibration-dimensions.check.json
          python tools/check_spec.py specifications/mixed-initiative-feedback.json --result specifications/mixed-initiative-feedback.check.json
          python tools/check_spec.py specifications/bounded-authority.json --result specifications/bounded-authority.check.json
          python tools/check_spec.py specifications/public-project-comparison.json --result specifications/public-project-comparison.check.json
          python tools/check_spec.py specifications/langgraph-pause-resume-mapping.json --result specifications/langgraph-pause-resume-mapping.check.json
          python tools/check_spec.py specifications/autogen-successor-comparison.json --result specifications/autogen-successor-comparison.check.json
          python tools/check_spec.py specifications/openhands-decision-gates.json --result specifications/openhands-decision-gates.check.json
          python tools/check_spec.py specifications/benchmark-governance-boundary.json --result specifications/benchmark-governance-boundary.check.json
          python tools/check_spec.py specifications/hitl-transfer-terminology.json --result specifications/hitl-transfer-terminology.check.json
          python tools/check_spec.py specifications/decision-evidence-separation.json --result specifications/decision-evidence-separation.check.json
          python tools/check_contracts.py examples/decision-request.json --kind request
          python tools/check_contracts.py examples/decision-record.json --kind record
          python tools/check_request_gate.py examples/decision-request.json --phase oracle
          python tools/check_request_gate.py examples/decision-request.json --phase implementation --task-revision 3
          python -m unittest discover -s tests -v

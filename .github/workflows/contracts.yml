          python tools/check_spec.py specifications/hitl-transfer-terminology.json --result specifications/hitl-transfer-terminology.check.json
          python tools/check_spec.py specifications/decision-evidence-separation.json --result specifications/decision-evidence-separation.check.json
          python tools/check_spec.py specifications/confidence-dimension-calibration.json --result specifications/confidence-dimension-calibration.check.json
          python tools/check_spec.py specifications/batch-independence.json --result specifications/batch-independence.check.json
          python tools/check_spec.py specifications/reusable-guidance-lifecycle.json --result specifications/reusable-guidance-lifecycle.check.json
          python tools/check_spec.py specifications/anti-rubber-stamp.json --result specifications/anti-rubber-stamp.check.json
          python tools/check_spec.py specifications/future-autonomy-evidence.json --result specifications/future-autonomy-evidence.check.json
          python tools/check_spec.py specifications/awq-formal-evidence.json --result specifications/awq-formal-evidence.check.json
          python tools/check_spec.py specifications/conceptual-authoring-gate.json --result specifications/conceptual-authoring-gate.check.json
          python tools/check_spec.py specifications/self-hosting-evolution.json --result specifications/self-hosting-evolution.check.json
          python tools/check_evaluation_plan.py examples/evaluation-scenarios.json
          ! python tools/check_evaluation_plan.py fixtures/broken/invalid-evaluation-scenarios.json
          python tools/check_clarification_gate.py examples/clarification-cases.json
          ! python tools/check_clarification_gate.py fixtures/broken/invalid-clarification-cases.json
          python tools/check_calibration.py examples/calibration-cases.json
          ! python tools/check_calibration.py fixtures/broken/invalid-calibration-cases.json
          python tools/check_mixed_initiative.py examples/mixed-initiative-cases.json
          ! python tools/check_mixed_initiative.py fixtures/broken/invalid-mixed-initiative-cases.json
          python tools/check_authority.py examples/authority-cases.json
